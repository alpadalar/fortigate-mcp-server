[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fortigate-mcp-server"
version = "1.0.0"
description = "FortiGate MCP Server - FastMCP based FortiGate management server"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "FortiGate MCP Team"},
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Networking :: Firewalls",
    "Topic :: System :: Systems Administration",
]
keywords = ["fortigate", "mcp", "fastmcp", "firewall", "management", "automation"]
requires-python = ">=3.11"
dependencies = [
    # Rollback pair (last verified-green before the fastmcp 4 move): fastmcp==3.4.10 with mcp>=1.30,<2.0 (restore `from mcp.types import TextContent`).
    # fastmcp floor 4.1.2 supersedes the CVE-2026-32871 (SSRF/path-traversal via OpenAPIProvider, GHSA-vv7q-7jx5-f767) floor of 3.2.0; this codebase does not use OpenAPIProvider/from_openapi. The old mcp<2.0 ceiling and the mcp 1.23 CVE-2025-66416 (GHSA-9h52-p55h-vw2f) floor are moot: fastmcp 4 does not depend on `mcp`, and mcp-types carries only the protocol types
    "fastmcp>=4.1.2,<5",
    "mcp-types>=2.3,<3",
    # httpx 0.28.1 matches the fastmcp-slim server extra; <1.0 excludes the unreviewed 1.0 major
    "httpx>=0.28.1,<1.0",
    # pydantic 2.12 is the floor required by fastmcp-slim 4 / mcp 2 (avoids moving it again in the fastmcp 4 migration)
    "pydantic>=2.12.0",
    # uvicorn 0.35 is the fastmcp-slim server extra floor; manual uvicorn.Server(Config(...)) use in server_http works through 0.54
    "uvicorn[standard]>=0.35.0",
    "asgiref>=3.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=7.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.17",
    "bandit>=1.8",
    "respx>=0.23.1",
]
test = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=7.0.0",
    "respx>=0.23.1",
    "pyyaml>=6.0",
]
lint = [
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.17",
    "ruff>=0.17.0",
]
security = [
    "bandit>=1.8",
]

[project.urls]
Homepage = "https://github.com/alpadalar/fortigate-mcp-server"
Documentation = "https://github.com/alpadalar/fortigate-mcp-server#readme"
Repository = "https://github.com/alpadalar/fortigate-mcp-server"
"Bug Tracker" = "https://github.com/alpadalar/fortigate-mcp-server/issues"

[project.scripts]
fortigate-mcp-server = "src.fortigate_mcp.server:server_main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--verbose",
    "--tb=short",
    "--cov=src",
    "--cov-report=html",
    "--cov-report=term-missing",
    "--cov-fail-under=67",
]
asyncio_mode = "auto"
markers = [
    "unit: marks tests as unit tests",
    "integration: marks tests as integration tests", 
    "slow: marks tests as slow running",
]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
# Explicit set keeps ruff 0.17 (new default rules) equal to the previous clean behavior
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101", "B601"]
