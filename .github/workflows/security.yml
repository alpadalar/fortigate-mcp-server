name: Security

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: gitleaks full-history scan
        # Digest-pinned: Docker Hub tags are mutable, and this container gets
        # read access to the full repository history (fetch-depth: 0). Digest
        # verified live against the registry (OCI index for tag v8.30.1):
        #   GET https://registry-1.docker.io/v2/zricethezav/gitleaks/manifests/v8.30.1
        run: |
          docker run --rm -v "$(pwd):/repo" \
            zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo -c /repo/.gitleaks.toml --no-color -v

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Install the project
        run: uv sync --locked --all-extras

      - name: Seed pip into the uv-managed venv
        # uv-created virtual environments intentionally omit pip (uv replaces
        # pip for package operations); pypa/gh-action-pip-audit's virtual-environment
        # mode activates the venv and runs `python -m pip install ...` to install
        # pip-audit itself, which fails with "No module named pip" unless pip is
        # seeded first. This mirrors the action's own selftest-virtualenv pattern
        # (python -m pip install --upgrade pip wheel before invoking the action),
        # adapted for a uv-managed venv via `uv pip install` instead of a bootstrap
        # python -m ensurepip/pip call.
        run: uv pip install --python .venv/bin/python pip

      - uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          virtual-environment: ".venv"

  container-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: fortigate-mcp-server:ci-scan

      - name: Trivy container scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "fortigate-mcp-server:ci-scan"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          exit-code: "1"
