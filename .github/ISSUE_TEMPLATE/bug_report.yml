name: Bug Report
description: Report a problem with fortigate-mcp-server
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.

        **Note:** The MCP tool surface (tool names and parameter schemas) is frozen for this
        release line — see `tests/fixtures/tool_schemas_*.json`. Do not file a bug asking for
        a tool name/parameter change; open a discussion instead.

        If you believe you've found a **security vulnerability**, please do not file a public
        bug report — use [GitHub Private Vulnerability Reporting](../../security/advisories/new)
        instead (see SECURITY.md).
  - type: textarea
    id: reproduction-steps
    attributes:
      label: Steps to reproduce
      description: Exact steps that trigger the bug, including the MCP tool call(s) involved.
      placeholder: |
        1. Configure a device with ...
        2. Call tool `list_firewall_policies` with ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual behavior
      description: What actually happened? Include any error messages or tool error output.
    validations:
      required: true
  - type: input
    id: python-version
    attributes:
      label: Python version
      placeholder: "3.11.x"
    validations:
      required: true
  - type: input
    id: server-version
    attributes:
      label: fortigate-mcp-server version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: transport
    attributes:
      label: Transport used
      options:
        - stdio
        - HTTP
    validations:
      required: true
